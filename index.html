<!DOCTYPE html>
<html lang="ko">
<head>

    content="VMware 비용 최적화부터 유지보수 대안과 보안 전략까지. Exclusive Seminar에 초대합니다."

  <meta

  >

  >

  <!-- 기타 SNS 링크 미리보기 -->
  <meta

    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Rimini Day | VMware 유지보수, 더 많은 선택권을 확보하는 로드맵"
  >

  <meta
    name="twitter:description"
    content="VMware 비용 최적화부터 유지보수 대안과 보안 전략까지. Exclusive Seminar에 초대합니다."
  >

  <meta
    name="twitter:image"
    content="https://riministreetevent.github.io/Rimini-Day/riministreetthumbnail.png"
  >

  <!-- 5초 후 Google Form으로 자동 이동 -->
  <meta
    http-equiv="refresh"
    content="5; url=https://docs.google.com/forms/d/e/1FAIpQLSc8xQY3uZBJFsHaMtxjtnpGHtrZtwPneu9IHx4Q0HNo-apZzw/viewform"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f4f4;
      color: #161616;
      font-family:
        Arial,
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 720px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: #ffffff;
    }

    /* 본문 초청장 이미지 */
    .hero-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
    }

    .content {
      padding:
        28px
        24px
        calc(40px + env(safe-area-inset-bottom));
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      margin: 0 0 16px;
      padding: 7px 14px;
      border-radius: 100px;
      background-color: #161616;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      line-height: 1;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 10px;
      color: #161616;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
    }

    h2 {
      margin: 0 0 20px;
      color: #161616;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.5;
      word-break: keep-all;
    }

    .description {
      margin: 0 0 14px;
      color: #4b4b4b;
      font-size: 16px;
      line-height: 1.7;
      word-break: keep-all;
    }

    .redirect-message {
      margin: 0 0 24px;
      color: #777777;
      font-size: 14px;
      line-height: 1.6;
    }

    .button {
      display: block;
      width: 100%;
      max-width: 360px;
      min-height: 54px;
      margin: 0 auto;
      padding: 16px 20px;
      border-radius: 8px;
      background-color: #fbe232;
      color: #161616;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(22, 22, 22, 0.12);
      transition:
        background-color 0.2s ease,
        transform 0.2s ease;
    }

    .button:hover {
      background-color: #f5da1f;
    }

    .button:active {
      background-color: #e8cf20;
      color: #161616;
      transform: translateY(1px);
    }

    .fallback {
      margin: 18px 0 0;
      color: #888888;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .content {
        padding:
          22px
          18px
          calc(32px + env(safe-area-inset-bottom));
      }

      .eyebrow {
        margin-bottom: 14px;
        font-size: 12px;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 18px;
      }

      .description {
        font-size: 15px;
      }

      .button {
        min-height: 52px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- 본문 이미지 -->
    <img
      class="hero-image"
      src="VMware_ABM.png"
      alt="Rimini Day VMware 유지보수 세미나 초청장"
    >

    <section class="content">

      <div class="eyebrow">
        Exclusive Seminar
      </div>

      <h1>Rimini Day</h1>

      <h2>
        VMware 유지보수,<br>
        더 많은 선택권을 확보하는 로드맵
      </h2>

      <p class="description">
        VMware 비용 최적화부터 유지보수 대안과 보안 전략까지,<br>
        새로운 선택지를 확인해 보세요.
      </p>

      <p class="redirect-message">
        5초 후 참석 신청 페이지로 자동 이동합니다.
      </p>

      <a
        class="button"
        href="https://docs.google.com/forms/d/e/1FAIpQLSc8xQY3uZBJFsHaMtxjtnpGHtrZtwPneu9IHx4Q0HNo-apZzw/viewform"
      >
        참석 신청하기
      </a>

      <p class="fallback">
        자동으로 이동하지 않으면 위 버튼을 눌러주세요.
      </p>

    </section>

  </main>
</body>
</html>
